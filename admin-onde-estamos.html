<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Onde Estamos — Backoffice Algartempo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .layout {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #0f172a;
      color: white;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      padding: 8px 10px 26px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 18px;
    }

    .brand img {
      width: 145px;
      max-width: 100%;
      background: white;
      padding: 8px;
      border-radius: 10px;
    }

    .brand small {
      display: block;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
    }

    .nav a:hover {
      background: #1e293b;
      color: white;
    }

    .nav a.active {
      background: #0284c7;
      color: white;
    }

    .logout {
      margin-top: 24px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .logout:hover {
      background: #1e293b;
      color: white;
    }

    .main {
      flex: 1;
      padding: 30px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 30px;
    }

    .topbar p {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .primary {
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      padding: 12px 17px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .primary:hover {
      background: #0369a1;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .offices-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .office-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15,23,42,.04);
    }

    .office-image {
      height: 170px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }

    .office-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 13px;
    }

    .office-body {
      padding: 18px;
    }

    .office-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .office-region {
      color: #0284c7;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .status {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .status.published {
      background: #dcfce7;
      color: #166534;
    }

    .status.hidden {
      background: #f1f5f9;
      color: #64748b;
    }

    .office-body h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .office-city {
      margin: 0 0 10px;
      color: #475569;
      font-size: 13px;
    }

    .office-address {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      min-height: 38px;
    }

    .office-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .action {
      flex: 1;
      padding: 9px 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .action:hover {
      background: #f8fafc;
    }

    .action.danger {
      color: #b91c1c;
      border-color: #fecaca;
    }

    .empty {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 45px;
      text-align: center;
      color: #64748b;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(900px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: #f1f5f9;
      cursor: pointer;
      font-size: 18px;
      color: #475569;
    }

    .form {
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 11px;
      font-weight: 800;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 10px 11px;
      outline: none;
      color: #0f172a;
      background: white;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #0284c7;
    }

    .media-preview {
      margin-top: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #f8fafc;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-preview img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }

    .media-help {
      color: #64748b;
      font-size: 11px;
      margin-top: 5px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 5px;
    }

    .check-row input {
      width: 17px;
      height: 17px;
    }

    .check-row label {
      font-size: 13px;
      color: #334155;
      font-weight: 600;
    }

    .modal-footer {
      position: sticky;
      bottom: 0;
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 15px 22px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .secondary {
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }

    .save {
      border: 0;
      background: #0284c7;
      color: white;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }

    .save:hover {
      background: #0369a1;
    }

    .save:disabled {
      opacity: .6;
      cursor: wait;
    }

    @media (max-width: 1100px) {
      .offices-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main {
        padding: 20px 15px;
      }

      .topbar {
        display: block;
      }

      .primary {
        margin-top: 15px;
      }

      .offices-grid {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Algartempo">
      <small>Backoffice — Gestão do site</small>
    </div>

    <nav class="nav">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-feiras.html">Feiras</a>
      <a href="admin-oportunidades.html">Oportunidades</a>
      <a href="admin-onde-estamos.html" class="active">Onde Estamos</a>
      <span class="disabled">Equipa</span>
      <span class="disabled">Empresas</span>
      <span class="disabled">Página Inicial</span>
      <span class="disabled">Media</span>
    </nav>

    <button class="logout" id="logoutButton">TERMINAR SESSÃO</button>
  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <h1>Onde Estamos</h1>
        <p>Gere os polos e escritórios da Algartempo.</p>
      </div>

      <button class="primary" id="newOfficeButton">
        + NOVO POLO
      </button>
    </div>

    <div id="message" class="message"></div>

    <div id="officesContainer" class="offices-grid">
      <div class="empty">
        A carregar polos...
      </div>
    </div>

  </main>

</div>


<!-- MODAL -->

<div id="modalBackdrop" class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">
        Novo Polo
      </h2>

      <button
        type="button"
        class="close"
        id="closeModalButton"
      >
        ×
      </button>

    </div>

    <form id="officeForm">

      <div class="form">

        <div class="grid">

          <div class="field">
            <label for="name">Nome do polo</label>
            <input id="name" required>
          </div>

          <div class="field">
            <label for="city">Cidade</label>
            <input id="city">
          </div>

          <div class="field">
            <label for="region">Região</label>
            <input id="region">
          </div>

          <div class="field">
            <label for="postalCode">Código postal</label>
            <input id="postalCode">
          </div>

          <div class="field full">
            <label for="address">Morada</label>
            <input id="address">
          </div>

          <div class="field">
            <label for="phone">Telefone</label>
            <input id="phone">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email">
          </div>

          <div class="field full">
            <label for="hours">Horário</label>
            <input
              id="hours"
              placeholder="Segunda a sexta, 09:00–18:00"
            >
          </div>

          <div class="field full">
            <label for="description">Descrição</label>
            <textarea id="description"></textarea>
          </div>

          <div class="field full">
            <label for="sectors">Setores</label>
            <textarea
              id="sectors"
              placeholder="Hotelaria, Logística, Construção, Administrativo..."
            ></textarea>
          </div>

          <div class="field">
            <label for="latitude">Latitude</label>
            <input id="latitude" type="number" step="any">
          </div>

          <div class="field">
            <label for="longitude">Longitude</label>
            <input id="longitude" type="number" step="any">
          </div>

          <div class="field">
            <label for="sortOrder">Ordem</label>
            <input id="sortOrder" type="number" value="0">
          </div>

          <div class="field">
            <label for="imageFile">Imagem do polo</label>

            <input
              id="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            >

            <div class="media-help">
              JPG, PNG ou WebP — máximo 10 MB.
            </div>

            <div
              id="imagePreview"
              class="media-preview"
            >
              <span style="color:#94a3b8;font-size:12px;">
                Sem imagem
              </span>
            </div>
          </div>

          <div class="field full">

            <div class="check-row">
              <input
                id="published"
                type="checkbox"
                checked
              >

              <label for="published">
                Polo publicado no site
              </label>
            </div>

          </div>

        </div>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="secondary"
          id="cancelButton"
        >
          CANCELAR
        </button>

        <button
          type="submit"
          class="save"
          id="saveButton"
        >
          GUARDAR POLO
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  let offices = [];
  let editingOfficeId = null;
  let currentImageUrl = "";

  const container =
    document.getElementById("officesContainer");

  const modalBackdrop =
    document.getElementById("modalBackdrop");

  const officeForm =
    document.getElementById("officeForm");

  const message =
    document.getElementById("message");

  const imageFile =
    document.getElementById("imageFile");

  const imagePreview =
    document.getElementById("imagePreview");


  async function checkLogin() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "admin.html";
      return false;
    }

    return true;
  }


  function showMessage(text, type = "success") {

    message.textContent = text;

    message.className =
      `message show ${type}`;

    setTimeout(() => {
      message.className = "message";
    }, 4000);
  }


  function getImageUrl(path) {

    if (!path) return "";

    const value = String(path).trim();

    if (
      value.startsWith("http://") ||
      value.startsWith("https://")
    ) {
      return value;
    }

    const cleanPath = value
      .replace(/^\/+/, "")
      .replace(/^media\//, "");

    return `${SUPABASE_URL}/storage/v1/object/public/media/${cleanPath}`;
  }


  async function loadOffices() {

    container.innerHTML = `
      <div class="empty">
        A carregar polos...
      </div>
    `;

    const {
      data,
      error
    } = await supabaseClient
      .from("offices")
      .select("*")
      .order("sort_order", {
        ascending: true
      })
      .order("name", {
        ascending: true
      });

    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          Erro ao carregar os polos.
        </div>
      `;

      showMessage(
        "Erro ao carregar os polos.",
        "error"
      );

      return;
    }

    offices = data || [];

    renderOffices();
  }


  function renderOffices() {

    if (!offices.length) {

      container.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          Ainda não existem polos criados.
          <br><br>
          Clica em <strong>+ NOVO POLO</strong> para começar.
        </div>
      `;

      return;
    }

    container.innerHTML = offices
      .map((office) => {

        const imageUrl =
          getImageUrl(office.image_url);

        return `
          <article class="office-card">

            <div class="office-image">

              ${
                imageUrl
                  ? `
                    <img
                      src="${escapeHtml(imageUrl)}"
                      alt="${escapeHtml(office.name)}"
                    >
                  `
                  : `
                    <div class="no-image">
                      Sem imagem
                    </div>
                  `
              }

            </div>

            <div class="office-body">

              <div class="office-meta">

                <span class="office-region">
                  ${escapeHtml(
                    office.region || "Portugal"
                  )}
                </span>

                <span
                  class="status ${
                    office.published
                      ? "published"
                      : "hidden"
                  }"
                >
                  ${
                    office.published
                      ? "Publicado"
                      : "Oculto"
                  }
                </span>

              </div>

              <h2>
                ${escapeHtml(office.name)}
              </h2>

              <p class="office-city">
                ${escapeHtml(
                  office.city || ""
                )}
              </p>

              <div class="office-address">

                ${
                  office.address
                    ? escapeHtml(
                        office.address
                      )
                    : "Morada não definida"
                }

                ${
                  office.postal_code
                    ? `<br>${escapeHtml(
                        office.postal_code
                      )}`
                    : ""
                }

              </div>

              <div class="office-actions">

                <button
                  class="action"
                  onclick="editOffice(${office.id})"
                >
                  EDITAR
                </button>

                <button
                  class="action"
                  onclick="togglePublished(${office.id})"
                >
                  ${
                    office.published
                      ? "OCULTAR"
                      : "PUBLICAR"
                  }
                </button>

                <button
                  class="action danger"
                  onclick="deleteOffice(${office.id})"
                >
                  APAGAR
                </button>

              </div>

            </div>

          </article>
        `;

      })
      .join("");
  }


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function openModal(office = null) {

    editingOfficeId =
      office ? office.id : null;

    currentImageUrl =
      office?.image_url || "";

    document.getElementById(
      "modalTitle"
    ).textContent =
      office
        ? "Editar Polo"
        : "Novo Polo";

    document.getElementById("name").value =
      office?.name || "";

    document.getElementById("city").value =
      office?.city || "";

    document.getElementById("region").value =
      office?.region || "";

    document.getElementById("address").value =
      office?.address || "";

    document.getElementById("postalCode").value =
      office?.postal_code || "";

    document.getElementById("phone").value =
      office?.phone || "";

    document.getElementById("email").value =
      office?.email || "";

    document.getElementById("hours").value =
      office?.hours || "";

    document.getElementById("description").value =
      office?.description || "";

    document.getElementById("sectors").value =
      office?.sectors || "";

    document.getElementById("latitude").value =
      office?.latitude ?? "";

    document.getElementById("longitude").value =
      office?.longitude ?? "";

    document.getElementById("sortOrder").value =
      office?.sort_order ?? 0;

    document.getElementById("published").checked =
      office?.published ?? true;

    imageFile.value = "";

    if (currentImageUrl) {

      imagePreview.innerHTML = `
        <img
          src="${escapeHtml(
            getImageUrl(currentImageUrl)
          )}"
          alt="Imagem atual"
        >
      `;

    } else {

      imagePreview.innerHTML = `
        <span style="color:#94a3b8;font-size:12px;">
          Sem imagem
        </span>
      `;
    }

    modalBackdrop.classList.add("show");
  }


  function closeModal() {

    modalBackdrop.classList.remove("show");

    officeForm.reset();

    editingOfficeId = null;

    currentImageUrl = "";

    imagePreview.innerHTML = `
      <span style="color:#94a3b8;font-size:12px;">
        Sem imagem
      </span>
    `;
  }


  async function uploadImage(file) {

    if (!file) return currentImageUrl;

    if (file.size > 10 * 1024 * 1024) {

      throw new Error(
        "A imagem não pode ultrapassar 10 MB."
      );
    }

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const safeName =
      file.name
        .replace(/\.[^/.]+$/, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60);

    const filePath =
      `offices/${Date.now()}-${safeName || "imagem"}.${extension}`;

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            contentType: file.type,
            upsert: false
          }
        );

    if (error) {
      throw error;
    }

    return filePath;
  }


  officeForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const saveButton =
        document.getElementById(
          "saveButton"
        );

      saveButton.disabled = true;

      saveButton.textContent =
        "A GUARDAR...";

      try {

        let imageUrl =
          currentImageUrl;

        if (imageFile.files.length > 0) {

          imageUrl =
            await uploadImage(
              imageFile.files[0]
            );
        }

        const officeData = {

          name:
            document.getElementById(
              "name"
            ).value.trim(),

          city:
            document.getElementById(
              "city"
            ).value.trim(),

          region:
            document.getElementById(
              "region"
            ).value.trim(),

          address:
            document.getElementById(
              "address"
            ).value.trim(),

          postal_code:
            document.getElementById(
              "postalCode"
            ).value.trim(),

          phone:
            document.getElementById(
              "phone"
            ).value.trim(),

          email:
            document.getElementById(
              "email"
            ).value.trim(),

          hours:
            document.getElementById(
              "hours"
            ).value.trim(),

          description:
            document.getElementById(
              "description"
            ).value.trim(),

          sectors:
            document.getElementById(
              "sectors"
            ).value.trim(),

          latitude:
            document.getElementById(
              "latitude"
            ).value
              ? Number(
                  document.getElementById(
                    "latitude"
                  ).value
                )
              : null,

          longitude:
            document.getElementById(
              "longitude"
            ).value
              ? Number(
                  document.getElementById(
                    "longitude"
                  ).value
                )
              : null,

          image_url:
            imageUrl || null,

          published:
            document.getElementById(
              "published"
            ).checked,

          sort_order:
            Number(
              document.getElementById(
                "sortOrder"
              ).value
            ) || 0,

          updated_at:
            new Date().toISOString()

        };


        let result;

        if (editingOfficeId) {

          result =
            await supabaseClient
              .from("offices")
              .update(officeData)
              .eq(
                "id",
                editingOfficeId
              );

        } else {

          result =
            await supabaseClient
              .from("offices")
              .insert(
                officeData
              );
        }


        if (result.error) {
          throw result.error;
        }


        closeModal();

        showMessage(
          editingOfficeId
            ? "Polo atualizado com sucesso."
            : "Polo criado com sucesso."
        );

        await loadOffices();

      } catch (error) {

        console.error(error);

        showMessage(
          `Erro: ${
            error.message ||
            "não foi possível guardar o polo."
          }`,
          "error"
        );

      } finally {

        saveButton.disabled = false;

        saveButton.textContent =
          "GUARDAR POLO";
      }

    }
  );


  window.editOffice = function(id) {

    const office =
      offices.find(
        item => item.id === id
      );

    if (!office) return;

    openModal(office);
  };


  window.togglePublished =
    async function(id) {

      const office =
        offices.find(
          item => item.id === id
        );

      if (!office) return;

      const {
        error
      } =
        await supabaseClient
          .from("offices")
          .update({
            published:
              !office.published,
            updated_at:
              new Date().toISOString()
          })
          .eq("id", id);

      if (error) {

        showMessage(
          "Erro ao alterar publicação.",
          "error"
        );

        return;
      }

      showMessage(
        office.published
          ? "Polo ocultado."
          : "Polo publicado."
      );

      loadOffices();
    };


  window.deleteOffice =
    async function(id) {

      const office =
        offices.find(
          item => item.id === id
        );

      if (!office) return;

      const confirmed =
        confirm(
          `Apagar o polo "${office.name}"?`
        );

      if (!confirmed) return;

      const {
        error
      } =
        await supabaseClient
          .from("offices")
          .delete()
          .eq("id", id);

      if (error) {

        showMessage(
          "Erro ao apagar o polo.",
          "error"
        );

        return;
      }

      showMessage(
        "Polo apagado com sucesso."
      );

      loadOffices();
    };


  imageFile.addEventListener(
    "change",
    () => {

      const file =
        imageFile.files[0];

      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {

        showMessage(
          "A imagem não pode ultrapassar 10 MB.",
          "error"
        );

        imageFile.value = "";

        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function () {

          imagePreview.innerHTML = `
            <img
              src="${reader.result}"
              alt="Pré-visualização"
            >
          `;
        };

      reader.readAsDataURL(file);
    }
  );


  document
    .getElementById(
      "newOfficeButton"
    )
    .addEventListener(
      "click",
      () => openModal()
    );


  document
    .getElementById(
      "closeModalButton"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "cancelButton"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
          "admin.html";
      }
    );


  modalBackdrop.addEventListener(
    "click",
    (event) => {

      if (
        event.target ===
        modalBackdrop
      ) {
        closeModal();
      }
    }
  );


  (async function init() {

    const loggedIn =
      await checkLogin();

    if (!loggedIn) return;

    await loadOffices();

  })();

</script>

</body>
</html>
